plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
	id "com.gradleup.shadow" version "9.3.1"
}

configurations {
    shadowImpl
    shadowModImpl
}

configurations.implementation.extendsFrom configurations.shadowImpl
configurations.modImplementation.extendsFrom configurations.shadowModImpl

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {

	mavenCentral()

	// Modrinth

	maven { url = "https://api.modrinth.com/maven" }

	// DevAuth

	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }

	// Hypixel Mod API
	
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }

	// Vigilance

	maven { url = "https://repo.essential.gg/repository/maven-public" }

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	mappings loom.officialMojangMappings()
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

	// Fabric Language Kotlin

	modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}")
	
	// DevAuth
	
	modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:${project.devauth_version}")
	
	// HypixelModAPI

	modImplementation("net.hypixel:mod-api:${project.hypixel_mod_api_version}")
	include("maven.modrinth:hypixel-mod-api:1.0.1+build.1+mc1.21")

	// Vigilance

	shadowImpl("gg.essential:vigilance:${project.vigilance_version}")
	shadowModImpl("gg.essential:universalcraft-1.21.11-fabric:${project.universalcraft_version}") {
        exclude(group: "net.fabricmc")
		exclude(group: "org.jetbrains.kotlin")
    }

	// Json Schema Validator
	
	shadowImpl("com.networknt:json-schema-validator:${project.json_schema_validator_version}")
}

tasks.named('remapJar') {
    archiveClassifier.set("")
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shadowImpl, project.configurations.shadowModImpl]
    exclude("META-INF/versions/**")
	mergeServiceFiles()

	// Vigilance

	relocate("gg.essential.vigilance", "io.github.lilfroggy.deps.vigilance")
    relocate("gg.essential.elementa", "io.github.lilfroggy.deps.elementa")
    relocate("gg.essential.universal", "io.github.lilfroggy.deps.universal")

	// Networknt

	relocate("com.networknt", "io.github.lilfroggy.deps.networknt")
	relocate("com.ethlo", "io.github.lilfroggy.deps.ethlo")
	relocate("com.fasterxml.jackson", "io.github.lilfroggy.deps.jackson")
	relocate("org.slf4j", "io.github.lilfroggy.deps.slf4j")
	relocate("org.yaml", "io.github.lilfroggy.deps.yaml")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	archiveClassifier.set('nodeps')
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
assemble.dependsOn remapJar

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	runs {
        client {
            vmArgs "-Ddevauth.enabled=true"
        }
    }
}